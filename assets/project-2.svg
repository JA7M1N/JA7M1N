e-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#fff" opacity=".86">Attention U-Net so responders know where to go</text><text x="44" y="200" font-family="'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#fff" opacity=".86">first.</text><circle cx="52" cy="250" r="6" fill="#3776ab"/><text x="66" y="255.5" font-family="'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#fff" opacity=".9">Python</text><g transform="translate(422 230)"><rect width="134" height="38" rx="19" fill="#fff" fill-opacity=".12" stroke="#fff" stroke-opacity=".45"/><text x="67" y="24.5" text-anchor="middle" font-family="'Cascadia Code','SF Mono',Consolas,'Courier New',monospace" font-size="12.5" font-weight="700" fill="#fff" letter-spacing="2">OPEN REPO →</text></g></g><rect x=".75" y=".75" width="598.5" height="298.5" rx="22" fill="none" stroke="url(#edge)" stroke-width="1.5"/></svg>